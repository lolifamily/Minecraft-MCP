# Fields consumed by mod metadata must also be added to the expandProps map in
# buildSrc/src/main/kotlin/multiloader-common.gradle.kts (processResources). Gradle-level settings (org.gradle.*)
# are not part of that map.
#
# Per-version RANGES and levels live in versions/<version>/gradle.properties; per-version version NUMBERS live in
# versions/<version>/libs.versions.toml. Both are reached through the mcpVersions extension registered by
# multiloader-common — full contract on McpVersions. Only version-independent settings stay here.

# Project
version=0.0.1-pre
group=org.js.lolifamily.minecraftmcp
# The BUILD JDK. NOT the emitted bytecode level — that's bytecode_version, per target MC.
java_version=25

# Mod identity (version-independent)
mod_name=Minecraft MCP
mod_author=lolifamily
mod_id=minecraft_mcp
license=MIT
credits=
description=In-process MCP server + Kotlin REPL for Minecraft.
# Consumed by fabric.mod.json's contact block and displayURL / issueTrackerURL in both mods.toml files.
homepage=https://minecraft-mcp.lolifamily.js.org
issues=https://github.com/lolifamily/Minecraft-MCP

# Gradle
# -Duser.language=en -Duser.country=US forces the JVM default Locale to English so javac's diagnostics and the
# SpongePowered mixin AP notes come out in English, not the OS locale. Locale is cached at JVM startup, so it
# MUST be a startup arg — a CLI -D or a project property set later can't move the already-initialized default.
org.gradle.jvmargs=-Xmx4G -Duser.language=en -Duser.country=US
org.gradle.daemon=true
# Safe: every cross-project reference here is configuration-time path math or carries a dependency edge.
# Exception: ben-manes' dependencyUpdates — run that with --no-parallel, as build.gradle.kts documents.
org.gradle.parallel=true

# All four MC toolchain plugins serialize cleanly (Unimined only with remapJar off — see common/build.gradle.kts).
#
# The rule when adding to this build: a lambda RETAINED INTO EXECUTION — a task action, a CopySpec rename — must not
# read a script top-level `val`. Those compile to FIELDS of the script class, so the lambda captures the script object,
# which the cache cannot restore. Copy the value into a local inside the task block first.
org.gradle.configuration-cache=true
# The active MC version is a tracked cache input, so each version node needs its own entry — the default of 1 makes
# every switch between nodes evict the others. noKotlinJij is a second tracked input, doubling the combinations.
org.gradle.configuration-cache.entries-per-key=16
