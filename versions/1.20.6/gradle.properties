# Non-version-number coordinates for MC 1.20.6. All three loaders on Java 21, mojmap runtime, so no srg_runtime.

# 1.20.6 is the mojmap-segment lower bound; ranges close at the 26.1 unobf boundary.
minecraft_version_range=[1.20.6, 26.1)
fabric_minecraft_version_range=>=1.20.6 <26.1
forge_loader_version_range=[50,)
neoforge_loader_version_range=[1,)

bytecode_version=21

# Forge 50.x ships an older vanilla SpongePowered Mixin whose CompatibilityLevel doesn't recognise the Java-21
# bytecode default, so declare Forge's mixin level at 17 (the classes stay Java 21, using only basic @Inject).
# fabric/neoforge omit this → they declare JAVA_21 via their Mixin forks.
forge_mixin_compat=17
