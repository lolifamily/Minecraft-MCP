# Non-version-number coordinates for MC 1.18.2. Version numbers are in libs.versions.toml.

# forge here is SRG (Forge 40; SRG names valid only through ~1.20.4), so the Maven range forge reads is CLOSED at the
# mojmap boundary 1.20.5 — a SRG jar would be accepted by, then crash on, a 26.1 unobf runtime. fabric is intermediary:
# wider ceiling (up to just before 26.1 unobf), semver syntax, hand-written into fabric.mod.json.
minecraft_version_range=[1.18.2, 1.20.5)
fabric_minecraft_version_range=>=1.18.2 <26.1
forge_loader_version_range=[40,)

bytecode_version=17

# Forge runs on SRG field/method names until Forge 50 / MC 1.20.6, so this node needs the mixin refmap + whole-jar
# reobf. Default off (1.20.6+ and 26.1+ skip it); SRG nodes opt in. Forge-only (fabric uses intermediary).
srg_runtime=true
