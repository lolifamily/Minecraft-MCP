# Non-version-number coordinates for MC 26.1.2 (first UNOBFUSCATED node).

# TOP node + unobfuscated → OPEN-ENDED ranges (no upper cap): readable names don't stop working at the next MC bump,
# so this forward-covers every future 26.x. forge/neoforge read the Maven range verbatim; fabric.mod.json uses semver.
minecraft_version_range=[26.1.2,)
fabric_minecraft_version_range=>=26.1.2
forge_loader_version_range=[64,)
neoforge_loader_version_range=[1,)

# Deobfuscation flag — gates the obf-vs-unobf branches in the loader build scripts. ≤1.21 nodes omit it.
unobfuscated=true

bytecode_version=25

# Forge's bundled vanilla Mixin caps CompatibilityLevel at JAVA_21, so a JAVA_25 config crashes it. The classes
# stay Java 25, using only basic @Inject. fabric/neoforge omit this → they declare JAVA_25 via their Mixin forks.
forge_mixin_compat=21
